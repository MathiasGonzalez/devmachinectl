<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>devmachinectl</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>devmachinectl</h1>
    <span class="subtitle">local dev machine control panel</span>
  </header>

  <main id="dashboard">
    <div class="card" id="card-colima">
      <div class="card-header">
        <span class="icon">🐳</span>
        <h2>Colima</h2>
        <span class="badge" id="badge-colima">…</span>
      </div>
      <div class="card-body" id="body-colima">Loading…</div>
      <div class="card-actions" id="actions-colima"></div>
    </div>

    <div class="card" id="card-docker">
      <div class="card-header">
        <span class="icon">📦</span>
        <h2>Docker</h2>
        <span class="badge" id="badge-docker">…</span>
      </div>
      <div class="card-body" id="body-docker">Loading…</div>
    </div>

    <div class="card" id="card-node">
      <div class="card-header">
        <span class="icon">🟩</span>
        <h2>Node.js</h2>
        <span class="badge" id="badge-node">…</span>
      </div>
      <div class="card-body" id="body-node">Loading…</div>
    </div>
  </main>

  <footer>
    <button id="btn-refresh">↻ Refresh</button>
    <span id="last-updated"></span>
  </footer>

  <script>
    async function loadStatus() {
      document.getElementById('last-updated').textContent = '';
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        renderColima(data.colima);
        renderDocker(data.docker);
        renderNode(data.node);
        document.getElementById('last-updated').textContent =
          'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error(e);
      }
    }

    function setBadge(id, text, cls) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'badge ' + cls;
    }

    function renderColima(c) {
      const body = document.getElementById('body-colima');
      const actions = document.getElementById('actions-colima');
      if (!c.installed) {
        setBadge('badge-colima', 'not installed', 'badge-off');
        body.textContent = 'Colima is not installed on this machine.';
        actions.innerHTML = '';
        return;
      }
      setBadge('badge-colima', c.running ? 'running' : 'stopped', c.running ? 'badge-on' : 'badge-off');
      body.innerHTML = '<pre>' + escHtml(c.raw || '') + '</pre>';
      actions.innerHTML = '';
      if (c.running) {
        const btn = mkBtn('Stop', 'btn-danger', async () => {
          btn.disabled = true;
          await fetch('/api/colima/stop', { method: 'POST' });
          await loadStatus();
        });
        actions.appendChild(btn);
      } else {
        const btn = mkBtn('Start', 'btn-primary', async () => {
          btn.disabled = true;
          await fetch('/api/colima/start', { method: 'POST' });
          await loadStatus();
        });
        actions.appendChild(btn);
      }
    }

    function renderDocker(d) {
      const body = document.getElementById('body-docker');
      if (!d.installed) {
        setBadge('badge-docker', 'not installed', 'badge-off');
        body.textContent = 'Docker is not installed on this machine.';
        return;
      }
      setBadge('badge-docker', d.running ? 'running' : 'stopped', d.running ? 'badge-on' : 'badge-off');
      let html = '';
      if (d.version) html += `<div class="kv"><span>Version</span><span>${escHtml(d.version)}</span></div>`;
      if (d.cpus)    html += `<div class="kv"><span>CPUs</span><span>${escHtml(d.cpus)}</span></div>`;
      if (d.memory)  html += `<div class="kv"><span>Memory</span><span>${escHtml(d.memory)}</span></div>`;
      body.innerHTML = html || 'Docker daemon is not running.';
    }

    function renderNode(n) {
      const body = document.getElementById('body-node');
      if (!n.installed) {
        setBadge('badge-node', 'not installed', 'badge-off');
        body.textContent = 'Node.js is not installed on this machine.';
        return;
      }
      setBadge('badge-node', 'installed', 'badge-on');
      body.innerHTML =
        `<div class="kv"><span>Node</span><span>${escHtml(n.version)}</span></div>` +
        (n.npm ? `<div class="kv"><span>npm</span><span>${escHtml(n.npm)}</span></div>` : '');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function mkBtn(label, cls, handler) {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = cls;
      b.addEventListener('click', handler);
      return b;
    }

    document.getElementById('btn-refresh').addEventListener('click', loadStatus);
    loadStatus();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
